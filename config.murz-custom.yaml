#ddev-generated
corepack_enable: true

web_extra_exposed_ports:
     - name: "murz-https-redirect"
       container_port: 81
       http_port: 80
       https_port: 10928

web_extra_daemons:
  - name: "murz-https-redirect"
    command: $HOME/bin/https-redirect.js
    directory: /tmp
    environment: HOME="%(ENV_HOME)s"

hooks:
  post-start:
    - exec: mkdir -p ${DDEV_APPROOT}/.git/info
    - exec: echo '# This file is generated by ddev-murz. Do not edit it manually.' > ${DDEV_APPROOT}/.ddev/ddev-murz/_dot-git-info/exclude
    - exec: cat ${DDEV_APPROOT}/.ddev/ddev-murz/_dot-git-info/exclude.d/* >> ${DDEV_APPROOT}/.ddev/ddev-murz/_dot-git-info/exclude
    - exec: cp ${DDEV_APPROOT}/.ddev/ddev-murz/_dot-git-info/exclude ${DDEV_APPROOT}/.git/info/exclude
