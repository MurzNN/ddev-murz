name: ddev-murz

project_files:
  - docker-compose.murz-mounts.yaml
  - homemounts/.cache/.keep
  - homemounts/.local/.keep
  - homemounts/.local/share/.keep
  - homemounts/.vscode-server/.keep
  - nginx/https-redirect.conf
  - config.murz-custom.yaml
  - config.murz-packages.yaml
  - homeadditions/.bashrc.d/murz.sh
  - web-build/Dockerfile.murz
  - root/.git/info/exclude

post_install_actions:
 - |
   mkdir -p ${DDEV_APPROOT}/.git/info
   cp root/.git/info/exclude ${DDEV_APPROOT}/.git/info/exclude -f
   rm root/.git/info/exclude

