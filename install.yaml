name: ddev-murz

dependencies:
  - MurzNN/ddev-vscode
  - MurzNN/ddev-cursor
  - MurzNN/ddev-x11

project_files:
  - ddev-murz
  - docker-compose.murz-mounts.yaml
  - nginx/murz.https-redirect.conf
  - config.murz-custom.yaml
  - config.murz-packages.yaml
  - homeadditions/.bashrc.d/murz.sh

post_install_actions:
 - |
   mkdir -p ${DDEV_APPROOT}/.git/info
   cat ddev-murz/_dot-git-info/exclude.d/* > ${DDEV_APPROOT}/.git/info/exclude

